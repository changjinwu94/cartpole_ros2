# Candidate LQR commissioning configuration; starts with drive disabled.
/**:
  ros__parameters:
    arduino_port: /dev/cartpole_arduino
    motor_port: /dev/cartpole_motor
    arduino_baud: 115200
    motor_baud: 115200
    serial_timeout_s: 0.1
    motor_connected: true  # Stage 1: sensors only; RS232 is not opened.
    hardware_configured: true
    motor_counts_per_rev: 3000  # Datasheet nominal; VERIFY POS units on your firmware.
    pulley_circumference_m: 0.04  # PLACEHOLDER: belt pitch * pulley teeth, in metres.
    motor_revs_per_pulley_rev: 9.7  # Gear reduction, motor revolutions / pulley revolution.
    motor_sign: 1  # + cart velocity must move RIGHT, away from left home switch.
    pole_sign: 1  # Verify experimentally with chosen angle convention.
    pole_ppr: 500  # PLACEHOLDER: label P/R, firmware performs x4 decoding.
    track_length_m: 0.147
    soft_margin_m: 0.0135
    stop_margin_m: 0.005
    max_velocity_m_s: 0.5
    max_motor_rpm: 4000.0
    braking_deceleration_m_s2: 3.5  # Must be a measured conservative braking value.
    max_acceleration_m_s2: 3.5
    home_velocity_m_s: 0.01
    home_timeout_s: 120.0
    sensor_timeout_s: 0.1
    command_timeout_s: 0.25
    loop_hz: 50.0
    balance_enabled: false
    balance_gains: [0.0, 0.0, 0.0, 0.0]  # v_cmd=-K*[x-x_target, x_dot, theta, theta_dot].
    balance_angle_limit_rad: 0.25
    target_position_m: 0.0735
    stop_timeout_s: 1.0
    stationary_rpm: 5.0  # Confirm sensor resolution/deadband before relying on this.

    # Explicit opt-in to new services; legacy balance remains disabled.
    hybrid_enabled: true
    hybrid_swing_timeout_s: 15.0
    hybrid_hold_s: 5.0
